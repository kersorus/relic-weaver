name: Build Relic Weaver

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relic-weaver-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.3'
  EXPORT_NAME: 'RelicWeaver'

jobs:
  export:
    name: Validate and export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('project.godot', 'main.tscn', 'src/**/*.gd', 'assets/**/*.png', 'assets/**/*.wav') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Prepare Godot CI environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config" \
                   build/android build/linux build/windows

          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ] && \
             [ ! -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
               "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi

          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          if [ -f "$SETTINGS" ] && ! grep -q 'export/android/java_sdk_path' "$SETTINGS"; then
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          fi

          godot --version

      - name: Import project and validate scripts/resources
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --quit

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . \
            --export-debug "Android" \
            "build/android/${EXPORT_NAME}-debug.apk"

      - name: Build Linux x86_64
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . \
            --export-release "Linux/X11" \
            "build/linux/${EXPORT_NAME}.x86_64"

      - name: Build Windows x86_64
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path . \
            --export-release "Windows Desktop" \
            "build/windows/${EXPORT_NAME}.exe"

      - name: Write build checksums
        shell: bash
        run: |
          set -euxo pipefail
          find build -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > build/SHA256SUMS.txt
          cat build/SHA256SUMS.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: relic-weaver-android
          path: build/android/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: relic-weaver-linux
          path: build/linux/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: relic-weaver-windows
          path: build/windows/
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: relic-weaver-checksums
          path: build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/android/*
            build/linux/*
            build/windows/*
            build/SHA256SUMS.txt
